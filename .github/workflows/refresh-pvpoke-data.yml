name: Refresh PvPoke data

on:
  workflow_dispatch:
  schedule:
    - cron: "17 9 * * 1"

permissions:
  contents: write

concurrency:
  group: pvpoke-data-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the Pages source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Download, validate, and atomically replace the local snapshot
        run: node tools/update-pvpoke-data.mjs

      - name: Commit a changed snapshot
        shell: bash
        run: |
          if git diff --quiet -- docs/static/data/pvpoke-v1.json docs/static/data/PVPOKE-LICENSE.txt; then
            echo "PvPoke snapshot is unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/static/data/pvpoke-v1.json docs/static/data/PVPOKE-LICENSE.txt
          git commit -m "chore: refresh PvPoke data snapshot"
          git push
